name: WControl
version: 1.4.0
description: App for on-board weighing

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  scoped_model: ^2.0.0-nullsafety.0
  cupertino_icons: ^1.0.3
  flutter_bluetooth_serial:
    git:
      url: https://github.com/bswhite1/flutter_bluetooth_serial
  path_provider: ^2.0.11
  #animated_splash_screen: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.11.0

flutter:
  uses-material-design: true
  assets:
    - assets/

# run command to generate icons: dart run flutter_launcher_icons:generate
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"

# run command to generate splash: flutter pub run flutter_native_splash:create
#                    for Git try: dart run flutter_native_splash:create
